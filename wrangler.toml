# Cloudflare deployment for Be Community via the OpenNext adapter
# (@opennextjs/cloudflare). This builds a Cloudflare **Worker** that runs the
# full Next.js server on the Node.js runtime — so Server Actions, the session
# proxy, RLS-scoped reads, and Node libs all work. See docs/DEPLOYMENT.md.

name = "becommunity-v1"
main = ".open-next/worker.js"

# OpenNext requires a recent compatibility date + nodejs_compat.
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# -----------------------------------------------------------------------------
# KEEP THE DASHBOARD'S PLAIN-TEXT VARIABLES. THIS LINE IS AN INCIDENT CONTROL.
# -----------------------------------------------------------------------------
# Wrangler treats this file as the source of truth for a Worker's environment,
# the way a Terraform file is. With `keep_vars` at its default of `false`, a
# `wrangler deploy` DELETES every dashboard-managed plain-text variable that
# this file does not declare. Encrypted secrets are not touched.
#
# On 2026-08-28 that is exactly what happened: a manual deploy removed
# NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY, every route
# answered HTTP 500 for about nine minutes, and service returned only after a
# rollback and a corrected preview promotion.
#
# `true` makes the deploy additive for plain-text variables: it leaves what the
# dashboard holds alone instead of reconciling it away.
#
# THE FIX IS NOT TO PUT THE VALUES HERE. This file is committed, so a `[vars]`
# block would publish configuration into git, and it would put the operator one
# careless edit away from committing the privileged key. The public values stay
# in the dashboard, the privileged key stays an encrypted secret, and this flag
# is what stops a deploy from reconciling the first group out of existence.
#
# Suite D's D-g check fails if this line is removed, flipped, or if a `[vars]`
# block ever appears below.
keep_vars = true

# Static assets emitted by the OpenNext build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# -----------------------------------------------------------------------------
# CONFIGURATION IS SPLIT IN TWO, AND THE SPLIT IS A SECURITY BOUNDARY.
# -----------------------------------------------------------------------------
# No value is stored in this file. It is committed, so anything written here is
# public. The two halves are set on the Worker itself:
#
#   RUNTIME (Worker -> Settings -> Variables and Secrets)
#     NEXT_PUBLIC_SUPABASE_URL        plain text  — public
#     NEXT_PUBLIC_SUPABASE_ANON_KEY   plain text  — public by design, RLS-protected
#     SUPABASE_SERVICE_ROLE_KEY       SECRET      — server only, bypasses all RLS
#
#   BUILD (Workers Builds -> Build variables)
#     NEXT_PUBLIC_SUPABASE_URL        only if a build-time inline is needed
#     NEXT_PUBLIC_SUPABASE_ANON_KEY   likewise
#
# SUPABASE_SERVICE_ROLE_KEY MUST NOT BE A BUILD VARIABLE. The build never needs
# it: nothing is rendered with privileged access at build time, and OpenNext
# copies Worker bindings into `process.env` BEFORE the first request handler
# runs, so the runtime secret is the value the server actually reads.
#
# The adapter also compiles the project's `.env` FILES into
# `.open-next/cloudflare/next-env.mjs` and replays them into `process.env` as
# defaults. A `.env.local` present in the build directory therefore ships its
# contents inside the Worker bundle — this is exactly how a service_role key
# reached a bundle once. Build the deployable artifact from a checkout with no
# `.env` file and keep credentials in the shell environment instead.
#
# `npm run test:secrets` (Suite D, D-e) enforces both halves of this: it fails
# if a privileged variable NAME appears in the compiled env snapshot, and it
# fails if the configured key's value appears anywhere in the build output.
