# Cloudflare deployment for Be Community via the OpenNext adapter
# (@opennextjs/cloudflare). This builds a Cloudflare **Worker** that runs the
# full Next.js server on the Node.js runtime — so Server Actions, the session
# proxy, RLS-scoped reads, and Node libs (exceljs) all work. See docs/DEPLOYMENT.md.

name = "be-community"
main = ".open-next/worker.js"

# OpenNext requires a recent compatibility date + nodejs_compat.
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets emitted by the OpenNext build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# NOTE: secrets are NOT stored here. Set them on the Worker (dashboard ->
# Settings -> Variables, or `wrangler secret put`):
#   NEXT_PUBLIC_SUPABASE_URL        (plain)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY   (plain — public, RLS-protected)
#   SUPABASE_SERVICE_ROLE_KEY       (ENCRYPTED secret — server only, never public)
