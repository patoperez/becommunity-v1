# Cloudflare deployment for Be Community via the OpenNext adapter
# (@opennextjs/cloudflare). This builds a Cloudflare **Worker** that runs the
# full Next.js server on the Node.js runtime — so Server Actions, the session
# proxy, RLS-scoped reads, and Node libs all work. See docs/DEPLOYMENT.md.

name = "becommunity-v1"

# -----------------------------------------------------------------------------
# THE ENTRY IS THIS PROJECT'S, AND IT WRAPS THE GENERATED ONE.
# -----------------------------------------------------------------------------
# This was `.open-next/worker.js`, the entry the OpenNext adapter generates. Read
# that file: it awaits the middleware handler, performs a REQUEST-TIME `import()`
# of the server handler, and awaits that — with no `try`/`catch` anywhere. A
# rejection from any of the three reaches Cloudflare, which answers **Error 1101,
# "Worker threw a JavaScript exception"**, on whatever route the reader asked
# for. Unit 6B.4B2N recorded thirteen 1101s, on routes including `/login`.
# ⓘ Corrected in Unit 6B.4B2P: those were not rejections. Cloudflare's analytics
# record them as `exceededResources` TERMINATIONS, which no `catch` ever sees.
# The boundary covers rejections only.
#
# `src/worker-entry.ts` imports the generated entry, re-exports its Durable
# Object classes unchanged, and calls it through the boundary in
# `src/lib/runtime/boundary.ts` — one `try`/`catch`. It adds no behaviour to a
# request that succeeds.
main = "src/worker-entry.ts"

# OpenNext requires a recent compatibility date + nodejs_compat.
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# -----------------------------------------------------------------------------
# KEEP THE DASHBOARD'S PLAIN-TEXT VARIABLES. THIS LINE IS AN INCIDENT CONTROL.
# -----------------------------------------------------------------------------
# Wrangler treats this file as the source of truth for a Worker's environment,
# the way a Terraform file is. With `keep_vars` at its default of `false`, a
# `wrangler deploy` DELETES every dashboard-managed plain-text variable that
# this file does not declare. Encrypted secrets are not touched.
#
# On 2026-08-28 that is exactly what happened: a manual deploy removed
# NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY, every route
# answered HTTP 500 for about nine minutes, and service returned only after a
# rollback and a corrected preview promotion.
#
# `true` makes the deploy additive for plain-text variables: it leaves what the
# dashboard holds alone instead of reconciling it away.
#
# THE FIX IS NOT TO PUT THE VALUES HERE. This file is committed, so a `[vars]`
# block would publish configuration into git, and it would put the operator one
# careless edit away from committing the privileged key. The public values stay
# in the dashboard, the privileged key stays an encrypted secret, and this flag
# is what stops a deploy from reconciling the first group out of existence.
#
# Suite D's D-g check fails if this line is removed, flipped, or if a `[vars]`
# block ever appears below.
keep_vars = true

# -----------------------------------------------------------------------------
# WORKERS LOGS: THE APPLICATION'S OWN LINES, AND NOT CLOUDFLARE'S URL LOG.
# -----------------------------------------------------------------------------
# The API reported `observability: null` for this Worker — it was never enabled
# — so no per-invocation record was retained for any of the Ray IDs Unit 6B.4B2N
# recorded, and `wrangler tail` captured nothing for them. Retention is 7 days
# on a paid plan and 3 on free, and it is NOT retroactive.
# ⓘ Corrected in Unit 6B.4B2P: this heading called the missing log «the reason
# the 1101 has no explanation» and said it answers «what threw?». Nothing was
# thrown. Cloudflare's analytics record `exceededResources` terminations, and
# those analytics exist whether or not this block does.
#
# `head_sampling_rate = 1` is deliberate: the lines this application writes are
# rare failure records (`src/lib/runtime/unavailable.ts`), and a sampled log of
# a rare event is a log that misses it.
#
# INVOCATION LOGS ARE OFF, AND THAT IS A PRIVACY DECISION (Unit 6B.4B2P). With
# `enabled = true` Cloudflare ALSO writes an automatic invocation log for every
# request, carrying its method and FULL URL — `/studio/e/<study-uuid>/revision`,
# any query string — and keeps it for the retention period. 6B.4B2O committed a
# block that would have turned that on at a rate of 1, and described its logging
# as path-free, which was true only of its own line. Turning invocation logs off
# keeps the application's console lines and drops the URL log. It removes no
# evidence this project can use: the resource diagnosis rests on the GraphQL
# analytics dataset, which is unaffected, and the observability query API is not
# readable with the credential this project holds.
#
# ⚠️ NONE OF THIS BLOCK IS IN EFFECT UNTIL A DEPLOY. Observability is a
# SCRIPT-LEVEL, NON-VERSIONED setting: `wrangler versions upload` — and so every
# preview build — ignores it, and 6B.4B2O's upload left the Worker reporting
# `observability: null`, so no Workers Log of any kind was ever recorded for it.
# `wrangler deploy`, `wrangler versions deploy` (even redeploying the current
# version) or a dashboard change applies it to EVERY version, production
# included. A future diagnosis that needs per-invocation outcomes must therefore
# turn invocation logs on for the whole Worker — a deliberate, time-boxed,
# recorded change that states URLs are being retained — and revert it.
#
# THIS BLOCK MUST STAY BELOW THE TOP-LEVEL KEYS. A TOML table swallows every key
# that follows it, so placing it above `compatibility_date` silently made that
# key — and `keep_vars` — fields of `observability`; wrangler warned, and the
# build failed. `[observability.logs]` is a sub-table of it and follows it.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

# Static assets emitted by the OpenNext build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# -----------------------------------------------------------------------------
# CONFIGURATION IS SPLIT IN TWO, AND THE SPLIT IS A SECURITY BOUNDARY.
# -----------------------------------------------------------------------------
# No value is stored in this file. It is committed, so anything written here is
# public. The two halves are set on the Worker itself:
#
#   RUNTIME (Worker -> Settings -> Variables and Secrets)
#     NEXT_PUBLIC_SUPABASE_URL        plain text  — public
#     NEXT_PUBLIC_SUPABASE_ANON_KEY   plain text  — public by design, RLS-protected
#     SUPABASE_SERVICE_ROLE_KEY       SECRET      — server only, bypasses all RLS
#
#   BUILD (Workers Builds -> Build variables)
#     NEXT_PUBLIC_SUPABASE_URL        only if a build-time inline is needed
#     NEXT_PUBLIC_SUPABASE_ANON_KEY   likewise
#
# SUPABASE_SERVICE_ROLE_KEY MUST NOT BE A BUILD VARIABLE. The build never needs
# it: nothing is rendered with privileged access at build time, and OpenNext
# copies Worker bindings into `process.env` BEFORE the first request handler
# runs, so the runtime secret is the value the server actually reads.
#
# The adapter also compiles the project's `.env` FILES into
# `.open-next/cloudflare/next-env.mjs` and replays them into `process.env` as
# defaults. A `.env.local` present in the build directory therefore ships its
# contents inside the Worker bundle — this is exactly how a service_role key
# reached a bundle once. Build the deployable artifact from a checkout with no
# `.env` file and keep credentials in the shell environment instead.
#
# `npm run test:secrets` (Suite D, D-e) enforces both halves of this: it fails
# if a privileged variable NAME appears in the compiled env snapshot, and it
# fails if the configured key's value appears anywhere in the build output.
